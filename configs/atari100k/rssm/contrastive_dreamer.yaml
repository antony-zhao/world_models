# configs/atari100k_rssm.yaml
# DreamerV3-style baseline with RSSM. Reconstruction only, no MuDreamer objectives.
# Use this to verify RSSM works before running MuDreamer variant.

seed: 1
device: cuda
num_envs: 1
num_eval_envs: 5

env:
  game: breakout

action_dim: null
action_type: discrete
obs_shape: null

model:
  hidden_dim: 512

symlog:
  num_bins: 255
  low: -20.0
  high: 20.0

wm:
  obs_type: image
  use_combined_state: true    # DreamerV3 uses combined state for heads
  free_nats: 1.0

  obj_coef: 1.0
  dyn_coef: 0.5
  reward_coef: 1.0
  continue_coef: 1.0
  repr_coef: 0.1
  head_coef: 1.0

  latent:
    num_categories: 32
    num_codes: 32

  encoder:
    type: conv
    filter_base: 32
    num_convs: 4
    kernel_size: 4

  sequence_model:
    type: rssm
    d_model: 512
    hidden_dim: 512
    n_layers: 1
    use_block_linear: false

  posterior:
    num_hiddens: null
    unimix_prob: 0.01
    norm: layer

  prior:
    num_hiddens: null
    unimix_prob: 0.01
    norm: layer

  heads:
    num_hiddens: 1

  objectives:
    - name: contrastive
      weight: 1.0
      gamma: 0.99
      num_negatives: 1024
      loss_type: infonce
      anchor: obs  # obs: phi(u_t, a_t) vs u_{t+1..}; posterior: phi(q(z_t), a_t) vs u_{t+1..}; state: phi(h_t) vs u_t..
      energy: l2  # l2: -||phi - psi|| ; dot: phi^T psi (CRL)
      logsumexp_penalty: 0.1
      embed_dim: 64
      hidden_dim: 1024
      num_hiddens: 1
      norm: layer
      

actor:
  num_hiddens: 1
  actor_unimix: 0.01
  log_std_min: -5.0
  log_std_max: 2.0
  std_min: 0.1

critic:
  num_hiddens: 1

buffer:
  num_envs: ${num_envs}
  buffer_size: 100_000
  prioritized: false

optim:
  wm_lr: 1.0e-4
  ac_lr: 3.0e-5
  wm_eps: 1.0e-8
  ac_eps: 1.0e-5
  wm_clip: 1000.0
  ac_clip: 100.0

train:
  total_env_steps: 100_000
  prefill_steps: 1_000
  train_every: 1
  train_ratio: 1
  train_ac_after: 2_000

  wm_batch_size: 16
  wm_seq_len: 64
  ac_batch_size: 1024
  ac_seq_len: 8
  context_window: 16

  horizon: 15
  gamma: 0.985
  lambda_: 0.95
  entropy_coef: 3.0e-4
  critic_tau: 0.02
  returns_percentile_lo: 0.05
  returns_percentile_hi: 0.95
  returns_ema_tau: 0.02

  log_every: 500
  eval_every: 5_000
  eval_episodes: 10
  checkpoint_every: 25_000
  log_dir: ./runs/atari100k