# Atari100k config: STORM-style transformer world model with a continuous latent.
# Encoder trained by a LeJEPA objective (augmented views + SIGReg); dynamics trained
# LeWM-style with an MSE between the prior's prediction and the posterior latent.
# Same as storm.yaml otherwise. No reconstruction.
#
# Run: python -m world_models.torch.agents.train --config configs/atari100k/transformer/lejepa_storm.yaml

seed: 1
device: cuda
num_envs: 1
num_eval_envs: 5

env:
  game: breakout
  life_loss_terminal: true

action_dim: null
action_type: discrete
obs_shape: null

# ---- Shared model defaults
model:
  hidden_dim: 1024

# ---- Shared symlog discretization for value/reward heads
symlog:
  num_bins: 255
  low: -20.0
  high: 20.0

# ---- World model
wm:
  obs_type: image
  use_combined_state: false
  free_nats: 1.0       # KL only; unused with latent_loss: mse
  latent_loss: mse     # kl (categorical) or mse (continuous): dyn/repr terms as MSE

  obj_coef: 1.0
  dyn_coef: 2.0
  repr_coef: 2.0
  head_coef: 1.0
  reward_coef: 1.0
  continue_coef: 1.0

  latent:
    type: continuous   # posterior/prior use IdentityHead; latent_size = dim
    dim: 256

  encoder:
    type: conv
    filter_base: 32
    num_convs: 4
    kernel_size: 4

  sequence_model:
    type: transformer
    d_model: 512
    n_layers: 2
    num_heads: 8
    max_seq_len: 64   # KV cache length; imagination uses ac_seq_len + horizon (24) positions
    expand: 4
    dropout_p: 0.1
    use_sdpa: true

  posterior:
    num_hiddens: null

  prior:
    num_hiddens: null

  heads:
    num_hiddens: 1

  objectives:
    - name: lejepa
      views: 1
      weight: 8.0
      target: full
      lam: 0.05         # SIGReg weight; LeJEPA uses ~0.01-0.05, check view_loss vs lam*sigreg early
      augment: shift_intensity  # random shift (replicate pad) + intensity; maps to a function
      pad: 4             # max shift in px, each direction (DrQ / SPR Atari100k standard)
      intensity: 0.05    # brightness jitter scale; 0 turns it off

actor:
  num_hiddens: 1
  actor_unimix: 0.01
  log_std_min: -5.0
  log_std_max: 2.0
  std_min: 0.1

critic:
  num_hiddens: 1

buffer:
  num_envs: ${num_envs}
  buffer_size: 100_000
  prioritized: false

optim:
  wm_lr: 1.0e-4
  encoder_lr: 1.0e-4
  ac_lr: 3.0e-5
  wm_eps: 1.0e-8
  ac_eps: 1.0e-8
  wm_clip: 1000.0
  ac_clip: 100.0

train:
  total_env_steps: 100_000
  prefill_steps: 1_000
  train_every: 1
  train_ratio: 1
  train_ac_after: 5_000

  wm_batch_size: 16
  wm_seq_len: 64
  ac_batch_size: 1024
  ac_seq_len: 8
  context_window: 16

  horizon: 16
  gamma: 0.985
  lambda_: 0.95
  entropy_coef: 3.0e-4
  critic_tau: 0.02
  returns_percentile_lo: 0.05
  returns_percentile_hi: 0.95
  returns_ema_tau: 0.02

  log_every: 500
  eval_every: 5_000
  eval_episodes: 10
  checkpoint_every: 25_000
  log_dir: ./runs/atari100k