# ---------- core
seed: 0
device: cuda
num_envs: 1
num_eval_envs: 5

env:
  game: ALE/Pong-v5

# Filled in by train.py from env spaces
action_dim: null
action_type: discrete
obs_shape: null

# ---------- shared model defaults
model:
  hidden_dim: 1024
  act: silu

# ---------- shared symlog discretization for value/reward heads
symlog:
  num_bins: 255
  low: -20.0
  high: 20.0

# ---------- world model
wm:
  obs_type: image
  use_combined_state: false
  free_nats: 1.0

  coefs:
    obj: 1.0
    dyn: 0.95      # MuDreamer's β_dyn (heavier than DreamerV3's 0.5)
    repr: 0.05     # MuDreamer's β_rep (lighter than DreamerV3's 0.1)
    head: 1.0

  latent:
    num_categories: 32
    num_codes: 32

  encoder:
    type: conv
    filter_base: 32
    num_convs: 4
    kernel_size: 4

  sequence_model:
    type: transformer
    d_model: 512
    n_layers: 2
    num_heads: 8
    max_seq_len: 256
    expand: 4
    dropout_p: 0.1
    use_sdpa: true

  posterior:
    n_layers: null
    unimix_prob: 0.01
    norm_type: batch      # MuDreamer requires BatchNorm inside representation network

  prior:
    n_layers: null
    unimix_prob: 0.01
    norm_type: layer

  heads:
    n_layers: 2

  # ---- List of objectives (for reference: mudreamer + auxiliary reconstruction)
  # Each entry has a `name` and its own hyperparameters.
  # `weight` scales the objective's contribution to the total loss.
  objectives:
    - name: mudreamer
      weight: 1.0
      action_weight: 1.0
      value_weight: 1.0
      slow_tau: 0.01
      gamma: 0.997
      lambda_: 0.95

    - name: reconstruction
      weight: 1.0
      obs_type: image
      # decoder mirrors encoder by default; override any field to differ
      decoder: {}

# ---------- actor / critic
actor:
  num_hiddens: 2
  actor_unimix: 0.01
  log_std_min: -5.0
  log_std_max: 2.0
  std_min: 0.1

critic:
  num_hiddens: 2

# ---------- buffer
buffer:
  buffer_size: 200_000
  device: cuda
  prioritized: false

# ---------- optimizer
optim:
  wm_lr: 1.0e-4
  ac_lr: 3.0e-5
  eps: 1.0e-8
  wm_clip: 1000.0
  ac_clip: 100.0

# ---------- training schedule
train:
  total_env_steps: 100_000
  prefill_steps: 1_000
  train_every: 1
  train_ratio: 1
  train_ac_after: 10_000
  wm_batch_size: 16
  wm_seq_len: 64
  ac_batch_size: 1024
  ac_seq_len: 8
  context_window: 16
  horizon: 15
  gamma: 0.997
  lambda_: 0.95
  entropy_coef: 3.0e-4
  critic_tau: 0.02
  returns_percentile_lo: 0.05
  returns_percentile_hi: 0.95
  returns_ema_tau: 0.02
  log_every: 500
  eval_every: 5_000
  eval_episodes: 10
  checkpoint_every: 25_000
  log_dir: ./runs